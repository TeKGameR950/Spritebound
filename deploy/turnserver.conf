# coturn example for Spritebound proximity voice.
# The game server derives short-lived credentials from the same secret (TURN_SECRET).
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=change-me
realm=spritebound.world
total-quota=300
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-cli
# Block relaying into private networks.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# For TLS on 5349, point these at your certificates:
# cert=/etc/letsencrypt/live/turn.spritebound.world/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.spritebound.world/privkey.pem
